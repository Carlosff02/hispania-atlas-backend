# =============================================================================
#  Hispania Atlas - API REST (Spring Boot)
# =============================================================================

spring.application.name=hispania-backend-spring

# --- Servidor -----------------------------------------------------------------
server.port=${PORT:8080}

# --- Datasource ----------------------------------------------------------------
# `url` y `username` llevan valor por defecto porque no son secretos y asi el
# arranque local sigue siendo comodo. La contraseña NO: al no tener default, si
# falta la variable Spring aborta al arrancar en vez de conectarse con una clave
# de ejemplo que ademas quedaria escrita en el historial de git para siempre.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hispania_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ------------------------------------------------------------
# El esquema lo gobierna Flyway, nunca Hibernate: `validate` solo comprueba que las
# entidades coincidan con las tablas y falla el arranque si no es así.
spring.jpa.hibernate.ddl-auto=validate

# Sin Open Session in View. La vista no puede tocar la sesion de Hibernate para
# serializar: cada DTO se construye dentro de la capa de servicio, ya con la
# sesion cerrada. Sin esto, un acceso perezoso a `Pais.lugares` durante la
# serializacion daria LazyInitializationException.
spring.jpa.open-in-view=false

# Fija la zona horaria de los TIMESTAMP para que no dependa de la del servidor.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Necesario por la migracion V1_1. Esa migracion normaliza las categorias que
# siembra V1 para que la restriccion de V2 se pueda aplicar, y su version (1.1) es
# MENOR que la de las migraciones que ya se aplicaron en una base existente.
# Sin esta propiedad, Flyway la rechaza con "Detected resolved migration not applied
# to database" y la aplicacion no arranca.
#
# En una base nueva no hace falta: V1, V1_1 y V2 se ejecutan en orden natural.
# En una base con V1..V6 aplicados, V1_1 se aplica como Actualizacion fuera de
# orden y no toca ninguna fila, porque la restriccion de V2 ya obliga a los valores
# canonicos.
#
# El nombre de V1_1 se interpreta como version 1.1: Flyway convierte los
# guiones bajos en puntos, de modo que se ordena entre V1 y V2.
spring.flyway.out-of-order=true

# --- Jackson --------------------------------------------------------------------
# `non_null` replica el comportamiento de Quarkus: los campos sin valor no viajan
# en el JSON. El frontend los valida con `?? 0` / fallback, asi que es seguro.
#
# Spring Boot 4 usa Jackson 3 (paquete `tools.jackson`), donde los enum de
# configuracion van en MAYUSCULAS y WRITE_DATES_AS_TIMESTAMPS ya viene desactivado,
# asi que no hace falta la propiedad `write-dates-as-timestamps`: `Instant` se
# serializa en ISO-8601 sin tocarla.
spring.jackson.default-property-inclusion=non_null

# --- CORS ------------------------------------------------------------------------
# En desarrollo el frontend Angular corre en 5173/4200 y el backend en 8080, que
# son origenes distintos: sin esto el navegador bloquea la respuesta.
# En produccion ambos se sirven desde el mismo origen y el CORS no se usa.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# --- JWT / seguridad -------------------------------------------------------------
# La clave NO tiene valor por defecto, por el mismo motivo que la contrasena de la
# base: una clave fija en este archivo quedaria escrita en el historial de git, y
# cualquiera con el repositorio podria firmar tokens con el rol que quisiera.
# Se genera una con:  openssl rand -base64 48   (48 bytes = 64 caracteres, > 32)
jwt.secret=${JWT_SECRET}
jwt.issuer=hispania-atlas
# Caducidad deliberadamente corta. El token no se consulta en la base en cada
# peticion, asi que un cambio de rol o una desactivacion no tienen efecto hasta
# que caduca: 8 horas es la ventana maxima en la que un usuario desactivado
# podria seguir operando. Con sessions revocadas, el problema desaparece, pero
# entonces el servidor tiene que guardar estado y se pierde la simplicidad.
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# --- Primer administrador del sistema ---------------------------------------------
# La aplicacion NO siembra usuarios en las migraciones: el primer ADMIN_SISTEMA se
# crea en el arranque si ya no existe ninguno. Asi la migracion V6 se puede aplicar
# en cualquier entorno sin dejar una cuenta con contrasena conocida.
#
# Si no se definen, la aplicacion arranca igualmente y no habra ningun
# administrador del sistema (util para las pruebas y para un entorno de
# desarrollo donde la primera cuenta se promociona a mano).
app.bootstrap.admin-username=${ADMIN_USERNAME:}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# --- Logging ----------------------------------------------------------------------
logging.level.com.hispania=INFO
logging.level.org.hibernate.SQL=WARN
